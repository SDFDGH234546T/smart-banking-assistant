slots:
  account_no:
    type: text
    label: 银行账户号
    description: 用户的银行账户号

  account_status:
    type: text
    label: 账户状态
    description: 银行账户当前状态

  account_summary:
    type: text
    label: 账户摘要
    description: 银行账户余额、冻结金额及产品等摘要信息

  transaction_no:
    type: text
    label: 交易流水号
    description: 当前咨询交易的唯一标识

  transaction_count:
    type: text
    label: 交易笔数
    description: 查询到的账户交易总笔数

  transaction_summary:
    type: text
    label: 交易明细摘要
    description: 账户近期交易明细的展示文本

  freeze_reason:
    type: text
    label: 冻结或挂失原因
    description: 申请账户冻结或挂失的原因

  recommendation_summary:
    type: text
    label: 推荐结果
    description: 账户产品推荐结果的展示文本

flows:
  onboarding:
    name: 欢迎引导
    description: 在聊天窗口初次打开时欢迎用户，并介绍助手可处理的银行账户与交易服务。这个 flow 通常由系统主动触发。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: response
        template:
          text: "你好，这里是智能银行客服助手。我可以帮你查账户状态和余额、查交易明细、了解账户或交易信息，也可以帮你提交账户冻结或挂失申请。"
        next: end

      - id: end
        type: end
        next: []

  account_status_query:
    name: 账户状态与余额查询
    description: 帮用户查询银行账户当前状态（如正常、已冻结、休眠、已销户）以及账户余额、冻结金额和账户产品信息。
    steps:
      - id: start
        type: start
        next: ask_account_no

      - id: ask_account_no
        type: collect
        slot_name: account_no
        template:
          text: "请告诉我你的银行账户号。"
        next: lookup_account_status

      - id: lookup_account_status
        type: action
        action: action_lookup_account_status
        next: show_account_status

      - id: show_account_status
        type: response
        template:
          text: "账户{{ slots.account_no }}当前状态是：{{ slots.account_status }}。{{ slots.account_summary }}"
        next: end

      - id: end
        type: end
        next: []

  transaction_history_query:
    name: 账户交易明细查询
    description: 帮用户查询指定银行账户的近期交易记录、交易金额、交易类型及交易状态。
    steps:
      - id: start
        type: start
        next: ask_account_no

      - id: ask_account_no
        type: collect
        slot_name: account_no
        template:
          text: "请告诉我需要查询交易明细的银行账户号。"
        next: lookup_transactions

      - id: lookup_transactions
        type: action
        action: action_lookup_transactions
        next: show_transactions

      - id: show_transactions
        type: response
        template:
          text: "账户{{ slots.account_no }}共查询到 {{ slots.transaction_count }} 笔交易。{{ slots.transaction_summary }}"
        next: end

      - id: end
        type: end
        next: []

  account_freeze_request:
    name: 账户冻结与挂失申请
    description: 帮用户提交银行账户冻结或挂失申请，收集银行账户号和冻结挂失原因。
    steps:
      - id: start
        type: start
        next: ask_account_no

      - id: ask_account_no
        type: collect
        slot_name: account_no
        template:
          text: "请告诉我需要申请冻结或挂失的银行账户号。"
        next: ask_freeze_reason

      - id: ask_freeze_reason
        type: collect
        slot_name: freeze_reason
        template:
          text: "请简单说明一下申请冻结或挂失的原因。"
        next: freeze_submitted

      - id: freeze_submitted
        type: response
        template:
          text: "好的，账户{{ slots.account_no }}的冻结/挂失申请已提交，原因是：{{ slots.freeze_reason }}。后续会尽快为你处理。"
        next: end

      - id: end
        type: end
        next: []

  account_product_recommendation:
    name: 账户产品推荐
    description: 基于当前账户为用户推荐适配的银行账户产品。当前版本先保留流程入口，具体推荐能力后续接入。
    steps:
      - id: start
        type: start
        next:
          - if: "slots.get('account_no')"
            then: respond
          - else: missing_account_context

      - id: missing_account_context
        type: response
        template:
          text: "请先选择一个银行账户，再继续咨询账户产品推荐。"
        next: end

      - id: respond
        type: action
        action: action_recommend_account_products
        next: show_recommendation

      - id: show_recommendation
        type: response
        template:
          text: "{{ slots.recommendation_summary }}"
        next: end

      - id: end
        type: end
        next: []

  human_handoff:
    name: 人工客服
    description: 将当前对话转交给银行人工客服坐席处理。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: response
        template:
          text: "好的，我来为你转接银行人工客服坐席，请稍等。"
        next: end

      - id: end
        type: end
        next: []
